<svg width="300" height="450" viewBox="0 0 300 450" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <clipPath id="revealClip">
      <rect x="0" y="0" width="300" height="0">
        <animate attributeName="height" values="0;450;450" keyTimes="0;0.5625;1" dur="8s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    <linearGradient id="scanGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3fb950" stop-opacity="0"/>
      <stop offset="50%" stop-color="#3fb950" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#3fb950" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="300" height="450" rx="10" fill="#0d1117"/>

  <g clip-path="url(#revealClip)">
    <image href="me%203.png" xlink:href="me%203.png" x="0" y="0" width="300" height="450" preserveAspectRatio="xMidYMid slice"/>
  </g>

  <rect x="0" y="0" width="300" height="6" fill="url(#scanGlow)">
    <animate attributeName="y" values="0;444;444" keyTimes="0;0.5625;1" dur="8s" repeatCount="indefinite"/>
  </rect>

  <rect x="1" y="1" width="298" height="448" rx="9" fill="none" stroke="#30363d" stroke-width="2"/>
</svg>
